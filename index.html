<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Scholarship Finder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header {
    text-align: center;
    color: white;
    padding: 30px 0;
  }
  header h1 { font-size: 2.5rem; margin-bottom: 8px; }
  header p { opacity: 0.9; font-size: 1.1rem; }
  .search-box {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    margin-bottom: 24px;
  }
  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  input, select {
    flex: 1;
    min-width: 180px;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus { border-color: #667eea; }
  button {
    padding: 12px 28px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #5568d3; }
  button:active { transform: scale(0.98); }
  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .stat {
    background: rgba(255,255,255,0.15);
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    backdrop-filter: blur(10px);
  }
  .results { display: grid; gap: 16px; }
  .card {
    background: white;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .card h3 { color: #2d3748; font-size: 1.25rem; }
  .flag { font-size: 1.5rem; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .tag {
    background: #edf2f7;
    color: #4a5568;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .tag.funding { background: #c6f6d5; color: #22543d; }
  .tag.deadline { background: #fed7d7; color: #742a2a; }
  .card p { color: #4a5568; line-height: 1.5; font-size: 0.95rem; }
  .detail-info {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #e2e8f0;
    display: none;
    font-size: 0.9rem;
  }
  .detail-info.open { display: block; }
  .detail-info p { margin-bottom: 8px; }
  .detail-info a {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
  }
  .detail-info a:hover { text-decoration: underline; }
  .no-results {
    background: white;
    border-radius: 14px;
    padding: 40px;
    text-align: center;
    color: #718096;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎓 Global Scholarship Finder</h1>
    <p>Search international scholarships for studying abroad</p>
  </header>

  <div class="search-box">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="🔍 Search by name, country, or field...">
      <select id="levelFilter">
        <option value="">All Levels</option>
        <option value="Bachelor">Bachelor's</option>
        <option value="Master">Master's</option>
        <option value="PhD">PhD</option>
        <option value="Any">Any Level</option>
      </select>
      <select id="countryFilter">
        <option value="">All Countries</option>
      </select>
    </div>
    <button onclick="resetFilters()">Reset Filters</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="results" id="results"></div>
</div>

// ---------- STATE ----------
let filtered = [...scholarships];

// ---------- INIT ----------
function init() {
  const countrySelect = document.getElementById('countryFilter');
  const countries = [...new Set(scholarships.map(s => s.country))].sort();
  countries.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    countrySelect.appendChild(opt);
  });

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('levelFilter').addEventListener('change', applyFilters);
  document.getElementById('countryFilter').addEventListener('change', applyFilters);

  render();
}

// ---------- FILTERING ----------
function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const level = document.getElementById('levelFilter').value;
  const country = document.getElementById('countryFilter').value;

  filtered = scholarships.filter(s => {
    const matchesQuery = !q ||
      s.name.toLowerCase().includes(q) ||
      s.country.toLowerCase().includes(q) ||
      s.field.toLowerCase().includes(q) ||
      s.description.toLowerCase().includes(q);
    const matchesLevel = !level || s.level.includes(level) || (level === 'Any' && s.level.includes('Any'));
    const matchesCountry = !country || s.country === country;
    return matchesQuery && matchesLevel && matchesCountry;
  });

  render();
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('levelFilter').value = '';
  document.getElementById('countryFilter').value = '';
  filtered = [...scholarships];
  render();
}

// ---------- RENDERING ----------
function render() {
  const stats = document.getElementById('stats');
  stats.innerHTML = `
    <span class="stat">📚 ${filtered.length} scholarship${filtered.length !== 1 ? 's' : ''} found</span>
    <span class="stat">🌍 ${new Set(filtered.map(s => s.country)).size} countries</span>
  `;

  const results = document.getElementById('results');
  if (filtered.length === 0) {
    results.innerHTML = `<div class="no-results">
      <h3>No scholarships found</h3>
      <p>Try adjusting your search or filters.</p>
    </div>`;
    return;
  }

  results.innerHTML = filtered.map((s, i) => `
    <div class="card" onclick="toggleDetail(this)">
      <div class="card-header">
        <h3>${s.flag} ${s.name}</h3>
      </div>
      <div class="tags">
        <span class="tag">${s.country}</span>
        ${s.level.map(l => `<span class="tag">${l}</span>`).join('')}
        <span class="tag funding">💰 ${s.funding}</span>
        <span class="tag deadline">⏰ ${s.deadline}</span>
      </div>
      <p>${s.description}</p>
      <div class="detail-info">
        <p><strong>Field of study:</strong> ${s.field}</p>
        <p><strong>Deadline:</strong> ${s.deadline}</p>
        <p><a href="${s.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Visit official website →</a></p>
      </div>
    </div>
  `).join('');
}

function toggleDetail(card) {
  const detail = card.querySelector('.detail-info');
  detail.classList.toggle('open');
}

// ---------- START ----------
init();
</script>
</body>
</html>
